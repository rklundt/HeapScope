# HeapScope release builds (sprint 3.7, peer review P17). When the owner publishes a GitHub release (DEVELOPER.md 7), this
# builds the release's tag with build/publish.sh (license files checked) for the runtimes HeapScope ships (sprint 3.9,
# ADR-039: win-x64 as a .zip, linux-x64 as a .tar.gz; macOS is not shipped), packs the CLI's dotnet tool, and attaches
# them, an SBOM (CycloneDX) of the app, the CLI and the worker, and SHA256SUMS of them all, each with a build provenance
# attestation in GitHub's attestation store. Builds are deterministic (ContinuousIntegrationBuild in CI). Nothing is
# signed (ADR-039: no certificate); the checksums and attestations are how a download is verified.
#
# Least privilege (3.7 review): the builds, which run every restored package's build logic, hold read access only and hand
# their files on as artifacts; one short job that runs no build holds the rights to attest and attach. A manual run takes
# a tag and, as a dry run (the default), attaches and attests nothing, so the workflow can be tried before a release.
# Only releases of HeapScope (tags v*) are built: a release that holds build inputs, such as the SkiaSharp native
# libraries (skia-native.yml), is not.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to build
        required: true
      dry-run:
        description: Build only; attach and attest nothing
        type: boolean
        default: true

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  AVALONIA_TELEMETRY_OPTOUT: '1'
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build:
    name: Build ${{ matrix.rid }}
    if: ${{ github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      # One runtime failing does not stop the other: its archive is still built and can be attached by a rerun.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - name: Publish and pack
        shell: bash
        run: |
          bash build/publish.sh ${{ matrix.rid }} "$RUNNER_TEMP/HeapScope-$TAG-${{ matrix.rid }}"
          bash build/archive.sh pack "$RUNNER_TEMP/HeapScope-$TAG-${{ matrix.rid }}" "$RUNNER_TEMP/out"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: archive-${{ matrix.rid }}
          path: ${{ runner.temp }}/out/HeapScope-*
          if-no-files-found: error
          retention-days: 7

  tool:
    name: The CLI's dotnet tool
    if: ${{ github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - name: Pack
        # One package for every system (ADR-039); a release's version is its tag's (a manual run may build any commit).
        shell: bash
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)
          [ "${{ github.event_name }}" != "release" ] || [ "v$version" = "$TAG" ] || { echo "The tag $TAG does not match the version $version"; exit 1; }
          bash build/pack-tool.sh "$RUNNER_TEMP/out"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tool
          path: ${{ runner.temp }}/out/HeapScope.Cli.*.nupkg
          if-no-files-found: error
          retention-days: 7

  tool-check:
    # The very file the release attaches, installed as INSTALL.md says on each system it ships for (3.9 review M4).
    name: Install the tool on ${{ matrix.os }}
    needs: tool
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tool
          path: ${{ runner.temp }}/tool
      - name: Install and run it
        shell: bash
        run: bash build/check-tool.sh "$RUNNER_TEMP/tool"

  sbom:
    name: SBOM of the app, the CLI and the worker
    if: ${{ github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - name: SBOMs
        shell: bash
        run: |
          dotnet tool install --global CycloneDX --version 6.3.1
          export PATH="$PATH:$HOME/.dotnet/tools"
          for project in UI Cli Worker; do
            dotnet CycloneDX "src/HeapScope.$project/HeapScope.$project.csproj" --output "$RUNNER_TEMP/sbom" \
              --filename "HeapScope-$TAG-sbom-$project.cdx.json" --output-format Json
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: ${{ runner.temp }}/sbom/*.cdx.json
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Attest and attach
    needs: [build, tool, tool-check, sbom]
    if: ${{ github.event_name == 'release' || !inputs.dry-run }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: ${{ runner.temp }}/assets
          merge-multiple: true
      - name: Checksums
        shell: bash
        run: (cd "$RUNNER_TEMP/assets" && sha256sum HeapScope-* HeapScope.Cli.*.nupkg > SHA256SUMS && cat SHA256SUMS)
      - name: Attest the build's provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/assets/HeapScope-*
            ${{ runner.temp }}/assets/HeapScope.Cli.*.nupkg
            ${{ runner.temp }}/assets/SHA256SUMS
      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$RUNNER_TEMP"/assets/HeapScope-* "$RUNNER_TEMP"/assets/HeapScope.Cli.*.nupkg "$RUNNER_TEMP/assets/SHA256SUMS" --clobber --repo "$GITHUB_REPOSITORY"
