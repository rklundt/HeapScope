# HeapScope release builds (sprint 3.7, peer review P17). When the owner publishes a GitHub release (DEVELOPER.md 7), this
# builds the release's tag for every runtime identifier with build/publish.sh (license files checked), attaches each
# tarball with a build provenance attestation, an SBOM (CycloneDX) of the app, the CLI and the worker, and SHA256SUMS of
# everything attached. Builds are deterministic (ContinuousIntegrationBuild in CI). Signing is sprint 2.8's.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  AVALONIA_TELEMETRY_OPTOUT: '1'
  TAG: ${{ github.event.release.tag_name }}

jobs:
  build:
    name: Build ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
          - os: macos-latest
            rid: osx-x64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - name: Publish and pack
        shell: bash
        run: |
          bash build/publish.sh ${{ matrix.rid }} "$RUNNER_TEMP/HeapScope-$TAG-${{ matrix.rid }}"
          (cd "$RUNNER_TEMP" && tar -czf "HeapScope-$TAG-${{ matrix.rid }}.tar.gz" "HeapScope-$TAG-${{ matrix.rid }}")
      - name: Attest the build's provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/HeapScope-${{ env.TAG }}-${{ matrix.rid }}.tar.gz
      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$RUNNER_TEMP/HeapScope-$TAG-${{ matrix.rid }}.tar.gz" --clobber --repo "$GITHUB_REPOSITORY"

  sbom-and-checksums:
    name: SBOM and checksums
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - name: SBOM of the app, the CLI and the worker
        run: |
          dotnet tool install --global CycloneDX --version 6.3.1
          export PATH="$PATH:$HOME/.dotnet/tools"
          for project in UI Cli Worker; do
            dotnet CycloneDX "src/HeapScope.$project/HeapScope.$project.csproj" --output "$RUNNER_TEMP/sbom" \
              --filename "HeapScope-$TAG-sbom-$project.cdx.json" --json
          done
      - name: Checksums of everything attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/assets"
          gh release download "$TAG" --pattern 'HeapScope-*.tar.gz' --dir "$RUNNER_TEMP/assets" --repo "$GITHUB_REPOSITORY"
          cp "$RUNNER_TEMP"/sbom/*.cdx.json "$RUNNER_TEMP/assets/"
          (cd "$RUNNER_TEMP/assets" && sha256sum HeapScope-* > SHA256SUMS && cat SHA256SUMS)
          gh release upload "$TAG" "$RUNNER_TEMP"/assets/*.cdx.json "$RUNNER_TEMP/assets/SHA256SUMS" --clobber --repo "$GITHUB_REPOSITORY"
