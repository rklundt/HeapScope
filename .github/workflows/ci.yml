# HeapScope CI (sprints 2.3.5, 2.3.6 and 3.6):
# - Windows builds everything, runs the fast and the integration tests, captures the LeakyConsole fixture with the CLI and
#   checks the known answers.
# - Linux and macOS build the engine, the worker, the CLI and the Avalonia app, run their tests, take a core dump of the
#   fixture with dotnet-dump, check the CLI's known answers and (Linux) open the dump in the app without a display.
# - Packages: self-contained builds per runtime identifier with their license files (checked), uploaded as artifacts on
#   pushes and manual runs.
# Tests run through build/test.sh and the fixture dump through build/fixture-dump.sh, as in the local gate (build/gate.sh).
# Test results (TRX: test names, outcomes and messages) are kept 14 days to track tests that fail now and then.
# Fixture dumps hold fixture data only and are never uploaded (ARCHITECTURE.md 12). Nothing here sends telemetry.
# Actions are pinned to the commit of a release (sprint 3.7, peer review P16); Dependabot proposes updates as PRs. CI
# restores packages in locked mode (Directory.Build.props: packages.lock.json in every project).
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  # Avalonia's build statistics (sprint 2.3.6, decision 5); Directory.Build.targets also removes the task that sends them.
  AVALONIA_TELEMETRY_OPTOUT: '1'
  # HeapScope's own logs (the CLI, the app and the workers they start; paths, counts and rules, never dump contents) go
  # to the runner's temp folder and are kept with the test results (sprint 3.6 review).
  Logging__File__Directory: ${{ github.workspace }}/artifacts/heapscope-logs

jobs:
  windows:
    name: Windows (build, fast and integration tests, fixture capture)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        # No token is left in the checkout for later steps (sprint 3.7, peer review P16).
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - name: Build
        id: build
        run: dotnet build HeapScope.sln -c Release
      - name: Fast tests
        timeout-minutes: 15
        shell: bash
        run: bash build/test.sh fast Release "$RUNNER_TEMP/test-results"
      - name: Integration tests
        # Sprint 3.6 (peer review P4): real captures, dumps, workers and the CLI, about three minutes.
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 20
        shell: bash
        run: bash build/test.sh integration Release "$RUNNER_TEMP/test-results"
      - name: Capture the fixture with the CLI and check the known answers
        # Sprint 2.3.6 (2.3.5 review M3): the Windows DAC path and capture, checked by CI too.
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 15
        shell: bash
        run: |
          cli=src/HeapScope.Cli/bin/Release/net10.0/heapscope-cli.exe
          bash build/fixture-dump.sh "$RUNNER_TEMP/leaky.dmp" "cli=$cli"
          bash build/check-known-answers.sh "$cli" "$RUNNER_TEMP/leaky.dmp"
      - name: Keep the test results and HeapScope's logs
        # Always, so a step that timed out still leaves its results (review).
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-windows
          path: |
            ${{ runner.temp }}/test-results
            ${{ github.workspace }}/artifacts/heapscope-logs
          if-no-files-found: warn
          retention-days: 14

  unix:
    name: ${{ matrix.name }} (engine, CLI, app, fixture dump)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    # macOS runs on an arm64 runner: informational until macOS ships (ADR-025).
    continue-on-error: ${{ matrix.informational }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
            informational: false
          - os: macos-latest
            name: macOS
            informational: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        # No token is left in the checkout for later steps (sprint 3.7, peer review P16).
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - name: Build the CLI and the app (with the worker) and the fixture
        id: build
        run: |
          dotnet build src/HeapScope.Cli -c Release
          dotnet build src/HeapScope.UI -c Release
          dotnet build fixtures/LeakyConsole -c Release
      - name: Tests
        # Every test project that runs here, found by build/test.sh rather than listed (peer review S1).
        timeout-minutes: 15
        run: bash build/test.sh fast Release "$RUNNER_TEMP/test-results"
      - name: Dump the fixture, check the known answers, open it in the app without a display
        # Runs when a test failed but the build did not: the dump, the CLI and the app are what this job is for.
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 15
        run: |
          dotnet tool install --global dotnet-dump --version 10.0.750501
          export PATH="$PATH:$HOME/.dotnet/tools"
          dump="$RUNNER_TEMP/leaky.dmp"
          bash build/fixture-dump.sh "$dump" dotnet-dump
          bash build/check-known-answers.sh src/HeapScope.Cli/bin/Release/net10.0/heapscope-cli "$dump"
          # The trust of a DAC next to a dump, where no signature check backs it (sprint 3.7, 3.6 review M19).
          HEAPSCOPE_FIXTURE_DUMP="$dump" HEAPSCOPE_REQUIRE_FIXTURE=1 dotnet test --project tests/HeapScope.Loaders.ClrMd.Tests -c Release --no-build --filter-class "*PlantedDacTests"
          # The Avalonia app opens the core dump headless and drills down as a user would (sprint 2.3.6).
          app=src/HeapScope.UI/bin/Release/net10.0/HeapScope
          "$app" --headless --smoke-open "$dump" --Logging:File:Directory "$RUNNER_TEMP/ui-log" || { cat "$RUNNER_TEMP"/ui-log/*.log; exit 1; }
          grep -h "Smoke open\|Smoke drill" "$RUNNER_TEMP"/ui-log/*.log | cut -c1-400
          grep -q "Smoke open types: .*Fixtures.Leaks.StaticCacheEntry 2000" "$RUNNER_TEMP"/ui-log/*.log || { echo "The app did not show 2000 StaticCacheEntry objects"; exit 1; }
      - name: Keep the test results and HeapScope's logs
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-${{ matrix.name }}
          path: |
            ${{ runner.temp }}/test-results
            ${{ github.workspace }}/artifacts/heapscope-logs
          if-no-files-found: warn
          retention-days: 14

  package:
    name: Package ${{ matrix.rid }}
    # Builds of a red commit are never uploaded.
    needs: [windows, unix]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            runs: true
          - os: ubuntu-latest
            rid: linux-x64
            runs: true
          - os: macos-latest
            rid: osx-arm64
            runs: true
          # Built on the arm64 runner, which cannot run it.
          - os: macos-latest
            rid: osx-x64
            runs: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        # No token is left in the checkout for later steps (sprint 3.7, peer review P16).
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - name: Publish the app and the CLI, self-contained, with the worker and the license files
        # publish.sh copies the license files and checks the folder (build/check-package.sh, sprint 3.6, peer review P3).
        shell: bash
        run: |
          bash build/publish.sh ${{ matrix.rid }} "$RUNNER_TEMP/HeapScope-${{ matrix.rid }}"
          # A tarball keeps the executables' modes, which an artifact upload of the folder drops (sprint 2.3.6 review H1).
          # Relative names: Git Bash's GNU tar reads "D:" in a Windows path as a remote host.
          (cd "$RUNNER_TEMP" && tar -czf "HeapScope-${{ matrix.rid }}.tar.gz" "HeapScope-${{ matrix.rid }}")
          du -sh "$RUNNER_TEMP/HeapScope-${{ matrix.rid }}" "$RUNNER_TEMP/HeapScope-${{ matrix.rid }}.tar.gz"
      - name: Run the build as a user would get it
        # Unpacked from the tarball: the CLI, its worker (started through the pipe) and the app without a display.
        if: ${{ matrix.runs }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/unpacked"
          (cd "$RUNNER_TEMP/unpacked" && tar -xzf "../HeapScope-${{ matrix.rid }}.tar.gz")
          dir="$RUNNER_TEMP/unpacked/HeapScope-${{ matrix.rid }}"
          bash build/check-package.sh "$dir"
          ext=""; [ "${{ matrix.rid }}" = "win-x64" ] && ext=".exe"
          "$dir/heapscope-cli$ext" --version
          "$dir/heapscope-cli$ext" worker ping
          grep -q '"System.GC.Server": true' "$dir/worker/HeapScope.Worker.runtimeconfig.json"
          "$dir/HeapScope$ext" --headless --smoke-synthetic 200000 --Logging:File:Directory "$RUNNER_TEMP/pkg-log" || { cat "$RUNNER_TEMP"/pkg-log/*.log; exit 1; }
          grep -h "Smoke run:" "$RUNNER_TEMP"/pkg-log/*.log
      - name: Upload
        # Build output only; on pushes to develop or main and manual runs (sprint 2.3.6, decision 7).
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: HeapScope-${{ matrix.rid }}
          path: ${{ runner.temp }}/HeapScope-${{ matrix.rid }}.tar.gz
          retention-days: 14
