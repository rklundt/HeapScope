# HeapScope CI (sprint 2.3.5): Windows builds everything and runs the fast tests; Linux and macOS build the engine, the
# worker and the CLI, run the engine's tests, take a core dump of the LeakyConsole fixture and analyze it with the CLI.
# The fixture dumps hold fixture data only; they are never uploaded (ARCHITECTURE.md 12).
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows (build, fast tests)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build HeapScope.sln -c Release
      - name: Fast tests
        run: dotnet test --solution HeapScope.sln -c Release --no-build --filter-not-trait "Category=Integration" --filter-not-trait "Category=Slow" --ignore-exit-code 8

  unix:
    name: ${{ matrix.name }} (engine, CLI, fixture dump)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    # macOS runs on an arm64 runner while HeapScope targets x64 (ADR-001): informational until the ADR decides.
    continue-on-error: ${{ matrix.informational }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
            informational: false
            platform: ''
          - os: macos-latest
            name: macOS
            informational: true
            platform: '-p:PlatformTarget=AnyCPU'
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build the CLI (with the worker) and the fixture
        run: |
          dotnet build src/HeapScope.Cli -c Release ${{ matrix.platform }}
          dotnet build fixtures/LeakyConsole -c Release ${{ matrix.platform }}
      - name: Engine tests
        run: |
          failed=""
          for project in Core Analysis Storage Worker Application Loaders.ClrMd; do
            dotnet test --project "tests/HeapScope.$project.Tests" -c Release ${{ matrix.platform }} || failed="$failed $project"
          done
          if [ -n "$failed" ]; then echo "Failed:$failed"; exit 1; fi
      - name: Dump the fixture and analyze it with the CLI
        # Runs even when a test failed: the dump and the CLI are what this job is for.
        if: ${{ !cancelled() }}
        run: |
          dotnet tool install --global dotnet-dump
          export PATH="$PATH:$HOME/.dotnet/tools"
          fixture=fixtures/LeakyConsole/bin/Release/net10.0/LeakyConsole.dll
          dotnet "$fixture" --leak all --count 2000 --payload 32 --late-garbage 300 > "$RUNNER_TEMP/fixture.log" 2>&1 &
          for i in $(seq 1 120); do grep -q READY "$RUNNER_TEMP/fixture.log" && break; sleep 1; done
          cat "$RUNNER_TEMP/fixture.log"
          pid=$(sed -n 's/.*READY pid=\([0-9]*\).*/\1/p' "$RUNNER_TEMP/fixture.log")
          dump="$RUNNER_TEMP/leaky.dmp"
          dotnet-dump collect --process-id "$pid" --type Full --output "$dump"
          kill "$pid" || true
          cli=src/HeapScope.Cli/bin/Release/net10.0/heapscope-cli
          "$cli" summary "$dump" --top 15
          "$cli" instances "$dump" --type Fixtures.Leaks.StaticCacheEntry --retained --top 5
          "$cli" paths "$dump" --type Fixtures.Leaks.StaticCacheEntry
          "$cli" summary "$dump" --filter Fixtures.Leaks --format json > "$RUNNER_TEMP/summary.json"
          grep -q '"Fixtures.Leaks.StaticCacheEntry"' "$RUNNER_TEMP/summary.json"
