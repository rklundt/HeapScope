# HeapScope CI (sprints 2.3.5, 2.3.6 and 3.6):
# - Windows builds everything, runs the fast and the integration tests, captures the LeakyConsole fixture with the CLI and
#   checks the known answers. The heavy integration tests run in a second Windows job beside it.
# - Linux builds the engine, the worker, the CLI and the Avalonia app, runs their tests, takes a core dump of the fixture
#   with dotnet-dump, checks the CLI's known answers and opens the dump in the app without a display.
# - Packages: self-contained builds per runtime identifier with their license files (checked), in their release archives,
#   built beside the tests and uploaded as artifacts on pushes and manual runs. The Windows and Linux ones are unpacked
#   and run as a user gets them, without .NET (Linux in a plain Ubuntu container), on a fixture dump, and the CLI's
#   dotnet tool is packed and installed from its file (sprint 3.9, ADR-039).
# - No macOS runners (owner, 2026-10-31: their minutes cost about ten times Linux's). The macOS packages are built on
#   Linux and not run; nothing here tests on macOS.
# Tests run through build/test.sh and the fixture dump through build/fixture-dump.sh, as in the local gate (build/gate.sh).
# Test results (TRX: test names, outcomes and messages) are kept 14 days to track tests that fail now and then.
# Fixture dumps hold fixture data only and are never uploaded (ARCHITECTURE.md 12). Nothing here sends telemetry.
# Actions are pinned to the commit of a release (sprint 3.7, peer review P16); Dependabot proposes updates as PRs. CI
# restores packages in locked mode (Directory.Build.props: packages.lock.json in every project).
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  # Avalonia's build statistics (sprint 2.3.6, decision 5); Directory.Build.targets also removes the task that sends them.
  AVALONIA_TELEMETRY_OPTOUT: '1'
  # HeapScope's own logs (the CLI, the app and the workers they start; paths, counts and rules, never dump contents) go
  # to the runner's temp folder and are kept with the test results (sprint 3.6 review).
  Logging__File__Directory: ${{ github.workspace }}/artifacts/heapscope-logs

jobs:
  windows:
    name: Windows (build, fast and integration tests, fixture capture)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        # No token is left in the checkout for later steps (sprint 3.7, peer review P16).
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - name: Build
        id: build
        run: dotnet build HeapScope.sln -c Release
      - name: Fast tests
        timeout-minutes: 15
        shell: bash
        run: bash build/test.sh fast Release "$RUNNER_TEMP/test-results"
      - name: Integration tests
        # Sprint 3.6 (peer review P4): real captures, dumps, workers and the CLI. The heavy collection runs in its own
        # job beside this one (2026-10-31, so a PR waits about half as long).
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 20
        shell: bash
        run: bash build/test.sh integration-light Release "$RUNNER_TEMP/test-results"
      - name: Capture the fixture with the CLI and check the known answers
        # Sprint 2.3.6 (2.3.5 review M3): the Windows DAC path and capture, checked by CI too.
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 15
        shell: bash
        run: |
          cli=src/HeapScope.Cli/bin/Release/net10.0/heapscope-cli.exe
          bash build/fixture-dump.sh "$RUNNER_TEMP/leaky.dmp" "cli=$cli"
          bash build/check-known-answers.sh "$cli" "$RUNNER_TEMP/leaky.dmp"
      - name: Keep the test results and HeapScope's logs
        # Always, so a step that timed out still leaves its results (review).
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-windows
          path: |
            ${{ runner.temp }}/test-results
            ${{ github.workspace }}/artifacts/heapscope-logs
          if-no-files-found: warn
          retention-days: 14

  windows-heavy:
    # The integration tests that load the machine heavily (gigabyte heaps and dumps, the Ctrl+C capture), which run one
    # at a time: about three minutes on their own, so they run beside the Windows job instead of after its tests.
    name: Windows heavy integration tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build HeapScope.sln -c Release
      - name: Heavy integration tests
        timeout-minutes: 20
        shell: bash
        run: bash build/test.sh integration-heavy Release "$RUNNER_TEMP/test-results"
      - name: Keep the test results and HeapScope's logs
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-windows-heavy
          path: |
            ${{ runner.temp }}/test-results
            ${{ github.workspace }}/artifacts/heapscope-logs
          if-no-files-found: warn
          retention-days: 14

  unix:
    name: ${{ matrix.name }} (engine, CLI, app, fixture dump)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        # No token is left in the checkout for later steps (sprint 3.7, peer review P16).
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - name: Build the CLI and the app (with the worker) and the fixture
        id: build
        run: |
          dotnet build src/HeapScope.Cli -c Release
          dotnet build src/HeapScope.UI -c Release
          dotnet build fixtures/LeakyConsole -c Release
      - name: Tests
        # Every test project that runs here, found by build/test.sh rather than listed (peer review S1).
        timeout-minutes: 15
        run: bash build/test.sh fast Release "$RUNNER_TEMP/test-results"
      - name: Dump the fixture, check the known answers, open it in the app without a display
        # Runs when a test failed but the build did not: the dump, the CLI and the app are what this job is for.
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 15
        run: |
          dotnet tool install --global dotnet-dump --version 10.0.750501
          export PATH="$PATH:$HOME/.dotnet/tools"
          dump="$RUNNER_TEMP/leaky.dmp"
          bash build/fixture-dump.sh "$dump" dotnet-dump
          bash build/check-known-answers.sh src/HeapScope.Cli/bin/Release/net10.0/heapscope-cli "$dump"
          # The trust of a DAC next to a dump, where no signature check backs it (sprint 3.7, 3.6 review M19).
          HEAPSCOPE_FIXTURE_DUMP="$dump" HEAPSCOPE_REQUIRE_FIXTURE=1 dotnet test --project tests/HeapScope.Loaders.ClrMd.Tests -c Release --no-build --filter-class "*PlantedDacTests"
          # The Avalonia app opens the core dump headless and drills down as a user would (sprint 2.3.6).
          app=src/HeapScope.UI/bin/Release/net10.0/HeapScope
          "$app" --headless --smoke-open "$dump" --Logging:File:Directory "$RUNNER_TEMP/ui-log" || { cat "$RUNNER_TEMP"/ui-log/*.log; exit 1; }
          grep -h "Smoke open\|Smoke drill" "$RUNNER_TEMP"/ui-log/*.log | cut -c1-400
          grep -q "Smoke open types: .*Fixtures.Leaks.StaticCacheEntry 2000" "$RUNNER_TEMP"/ui-log/*.log || { echo "The app did not show 2000 StaticCacheEntry objects"; exit 1; }
      - name: Keep the test results and HeapScope's logs
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-${{ matrix.name }}
          path: |
            ${{ runner.temp }}/test-results
            ${{ github.workspace }}/artifacts/heapscope-logs
          if-no-files-found: warn
          retention-days: 14

  package:
    name: Package ${{ matrix.rid }}
    # Runs beside the tests rather than after them (2026-10-31: three minutes off every run). Pushes to develop and main
    # come from PRs whose required checks passed; a manual run uploads its builds whatever its tests do.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            runs: true
          - os: ubuntu-latest
            rid: linux-x64
            runs: true
          # Built on Linux, which cannot run them (no macOS runners).
          - os: ubuntu-latest
            rid: osx-arm64
            runs: false
          - os: ubuntu-latest
            rid: osx-x64
            runs: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        # No token is left in the checkout for later steps (sprint 3.7, peer review P16).
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - name: Publish the app and the CLI, self-contained, with the worker and the license files, in the release archive
        # publish.sh copies the license files and checks the folder (build/check-package.sh, sprint 3.6, peer review P3).
        # The archive is the release's (sprint 3.9): a .zip for Windows; a .tar.gz elsewhere, which keeps the executables'
        # modes that an artifact upload of the folder drops (sprint 2.3.6 review H1).
        shell: bash
        run: |
          bash build/publish.sh ${{ matrix.rid }} "$RUNNER_TEMP/HeapScope-${{ matrix.rid }}"
          archive=$(bash build/archive.sh pack "$RUNNER_TEMP/HeapScope-${{ matrix.rid }}" "$RUNNER_TEMP/out")
          du -sh "$RUNNER_TEMP/HeapScope-${{ matrix.rid }}" "$archive"
      - name: Unpack the archive and take a dump of the fixture
        if: ${{ matrix.runs }}
        shell: bash
        run: |
          dir=$(bash build/archive.sh unpack "$RUNNER_TEMP"/out/HeapScope-${{ matrix.rid }}.* "$RUNNER_TEMP/unpacked")
          echo "UNPACKED=$dir" >> "$GITHUB_ENV"
          dotnet build fixtures/LeakyConsole -c Release
          if [ "${{ matrix.rid }}" = "win-x64" ]; then
            # Captured by the unpacked CLI, as a user would.
            bash build/fixture-dump.sh "$RUNNER_TEMP/dump/leaky.dmp" "cli=$dir/heapscope-cli.exe"
          else
            dotnet tool install --global dotnet-dump --version 10.0.750501
            export PATH="$PATH:$HOME/.dotnet/tools"
            bash build/fixture-dump.sh "$RUNNER_TEMP/dump/leaky.dmp" dotnet-dump
          fi
      - name: Run the build as a user gets it, without .NET
        # The CLI, its worker and the app (without a display) open the fixture dump (build/check-install.sh). Windows hides
        # its installed .NET; Linux runs in a plain Ubuntu container with only the libraries INSTALL.md lists. The image
        # runs the check only; nothing built in it ships.
        if: ${{ matrix.runs }}
        shell: bash
        run: |
          if [ "${{ matrix.rid }}" = "win-x64" ]; then
            bash build/check-install.sh "$UNPACKED" "$RUNNER_TEMP/dump/leaky.dmp"
          else
            docker run --rm -e HEAPSCOPE_DATA_FOLDER=/tmp/heapscope -v "$UNPACKED:/heapscope:ro" -v "$RUNNER_TEMP/dump:/dump" \
              -v "$PWD/build:/build:ro" ubuntu:24.04 bash -c 'apt-get update -qq && apt-get install -y -qq --no-install-recommends \
              libicu74 libfontconfig1 > /dev/null && bash /build/check-install.sh /heapscope /dump/leaky.dmp'
          fi
      - name: Pack the CLI as a dotnet tool and install it from its file
        if: ${{ matrix.runs }}
        shell: bash
        run: |
          bash build/pack-tool.sh "$RUNNER_TEMP/tool"
          bash build/check-tool.sh "$RUNNER_TEMP/tool" "$RUNNER_TEMP/dump/leaky.dmp"
      - name: Upload
        # Build output only; on pushes to develop or main and manual runs (sprint 2.3.6, decision 7).
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: HeapScope-${{ matrix.rid }}
          path: ${{ runner.temp }}/out/HeapScope-${{ matrix.rid }}.*
          retention-days: 14
