# SkiaSharp's native library without Skia's raw camera image decoder (2026-10-30). The NuGet native assets of SkiaSharp
# carry that decoder (Adobe's DNG SDK and Google's piex), which HeapScope never uses. This builds libSkiaSharp for
# win-x64, linux-x64 and macOS (one universal library for osx-arm64 and osx-x64) from SkiaSharp's own sources and build
# scripts, at the commit of the release HeapScope uses, with only the decoder's switches turned off. Each library is
# checked for DNG SDK and piex code (build/check-no-dng.sh), and the set gets checksums and a build provenance attestation.
# The owner attaches the set to a release of this repository; build/publish.sh downloads it from there by its pinned
# checksums (DEVELOPER.md 7, "SkiaSharp native libraries"). Rerun on every SkiaSharp update Avalonia takes. The macOS
# library needs a macOS runner, so it is built only on a manual run with "macos" checked (since 2026-10-31).
# Nothing here signs, publishes or sends telemetry.
name: SkiaSharp native without DNG

on:
  push:
    branches-ignore: [main, develop]
    paths: [.github/workflows/skia-native.yml]
  workflow_dispatch:
    inputs:
      macos:
        # macOS minutes cost about ten times Linux's (owner, 2026-10-31): the macOS library is built only when asked for.
        description: Also build the macOS library (a paid macOS runner)
        type: boolean
        default: false

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  # SkiaSharp v3.119.4, by commit: a tag can move.
  SKIASHARP_COMMIT: f568ac94dd768ef9a2f593537cfde2dd0d348ef5

jobs:
  windows:
    name: libSkiaSharp win-x64
    runs-on: windows-2022
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      # HeapScope beside SkiaSharp, not around it: HeapScope's nuget.config would apply to SkiaSharp's tool restore.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: heapscope
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: mono/SkiaSharp
          ref: ${{ env.SKIASHARP_COMMIT }}
          path: skiasharp
          fetch-depth: 1
          persist-credentials: false
      # The Skia fork and depot_tools at the commits SkiaSharp pins (the API docs submodule is not needed).
      - name: Submodules
        working-directory: skiasharp
        run: git submodule update --init --depth 1 externals/skia externals/depot_tools
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: skiasharp/global.json
      # The only change to SkiaSharp's build: the raw camera image decoder is left out.
      - name: Turn off the DNG SDK and piex
        working-directory: skiasharp
        run: |
          sed -i "s/skia_use_dng_sdk=true/skia_use_dng_sdk=false/; s/skia_use_piex=true/skia_use_piex=false/" native/windows/build.cake
          grep -n "skia_use_dng_sdk\|skia_use_piex" native/windows/build.cake
          git diff --stat
      - name: Build libSkiaSharp
        working-directory: skiasharp
        run: |
          dotnet tool restore
          vs="$("/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath)"
          python="$(python -c 'import sys; print(sys.executable)')"
          dotnet cake native/windows/build.cake --target=libSkiaSharp --arch=x64 --configuration=Release \
            --vsinstall="$vs" --python="$python"
      - name: Check and name
        run: |
          mkdir dist
          cp skiasharp/output/native/windows/x64/libSkiaSharp.dll dist/libSkiaSharp.win-x64.dll
          cp skiasharp/output/native/windows/x64/libSkiaSharp.pdb dist/libSkiaSharp.win-x64.pdb
          bash heapscope/build/check-no-dng.sh dist/*
          ls -l dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: skia-native-win-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  linux:
    name: libSkiaSharp linux-x64
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      # HeapScope beside SkiaSharp, not around it: HeapScope's nuget.config would apply to SkiaSharp's tool restore.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: heapscope
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: mono/SkiaSharp
          ref: ${{ env.SKIASHARP_COMMIT }}
          path: skiasharp
          fetch-depth: 1
          persist-credentials: false
      - name: Submodules
        working-directory: skiasharp
        run: git submodule update --init --depth 1 externals/skia externals/depot_tools
      - name: Turn off the DNG SDK and piex
        working-directory: skiasharp
        run: |
          perl -pi -e 's/skia_use_piex=true /skia_use_piex=false skia_use_dng_sdk=false /' native/linux/build.cake
          grep -n "skia_use_dng_sdk\|skia_use_piex" native/linux/build.cake
          git diff --stat
      # In SkiaSharp's own Debian 10 image (clang 13, glibc 2.28 at most, fontconfig), as SkiaSharp builds its Linux x64
      # library. The container runs as root, so git is told the checkout is safe.
      - name: Build libSkiaSharp
        working-directory: skiasharp
        run: |
          docker build --tag skiasharp-linux-x64 --build-arg BUILD_ARCH=x64 scripts/Docker/debian/10
          docker run --rm --volume "$PWD:/work" skiasharp-linux-x64 /bin/bash -c "\
            git config --global --add safe.directory '*' && \
            dotnet tool restore && \
            dotnet cake native/linux-clang-cross/build.cake --target=libSkiaSharp --arch=x64 --configuration=Release \
              --verifyIncluded=fontconfig"
      - name: Check and name
        run: |
          mkdir dist
          cp skiasharp/output/native/linux/x64/libSkiaSharp.so dist/libSkiaSharp.linux-x64.so
          bash heapscope/build/check-no-dng.sh dist/*
          ls -l dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: skia-native-linux-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  macos:
    name: libSkiaSharp macOS (arm64 and x64)
    if: ${{ inputs.macos }}
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      # HeapScope beside SkiaSharp, not around it: HeapScope's nuget.config would apply to SkiaSharp's tool restore.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: heapscope
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: mono/SkiaSharp
          ref: ${{ env.SKIASHARP_COMMIT }}
          path: skiasharp
          fetch-depth: 1
          persist-credentials: false
      - name: Submodules
        working-directory: skiasharp
        run: git submodule update --init --depth 1 externals/skia externals/depot_tools
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: skiasharp/global.json
      - name: Turn off the DNG SDK and piex
        working-directory: skiasharp
        run: |
          perl -pi -e 's/skia_use_piex=true /skia_use_piex=false skia_use_dng_sdk=false /' native/macos/build.cake
          grep -n "skia_use_dng_sdk\|skia_use_piex" native/macos/build.cake
          git diff --stat
      # SkiaSharp builds its macOS libraries with Xcode 16.2; the runner's default is used if that one is not installed.
      - name: Build libSkiaSharp
        working-directory: skiasharp
        run: |
          if [ -d /Applications/Xcode_16.2.app ]; then sudo xcode-select -s /Applications/Xcode_16.2.app; fi
          xcodebuild -version
          dotnet tool restore
          dotnet cake native/macos/build.cake --target=libSkiaSharp --configuration=Release
      - name: Check and name
        run: |
          mkdir dist
          cp skiasharp/output/native/osx/libSkiaSharp.dylib dist/libSkiaSharp.osx.dylib
          lipo -info dist/libSkiaSharp.osx.dylib
          bash heapscope/build/check-no-dng.sh dist/*
          ls -l dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: skia-native-osx
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  attest:
    name: Checksums and provenance
    needs: [windows, linux, macos]
    # The macOS job is skipped unless asked for; its library is then left out of the set.
    if: ${{ !cancelled() && needs.windows.result == 'success' && needs.linux.result == 'success' && needs.macos.result != 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/skia-native
          pattern: skia-native-*
          merge-multiple: true
      - name: Checksums
        run: (cd "$RUNNER_TEMP/skia-native" && sha256sum libSkiaSharp.* > SHA256SUMS && cat SHA256SUMS)
      - name: Attest the build's provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/skia-native/libSkiaSharp.*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: skia-native
          path: ${{ runner.temp }}/skia-native/*
          if-no-files-found: error
          retention-days: 14
